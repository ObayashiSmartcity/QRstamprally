<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>OC Stamp Rally</title>

<script src="https://cdnjscript>

<style>
:root{
  --bg:#f5f3ef;
  --card:#ffffff;
  --text:#1c1c1a;
  --sub:#76766f;
  --line:#e6e1d8;
  --accent:#a89264;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HERO */

.hero{
  position:relative;
  height:90vh;
  overflow:hidden;
}

#bg3d{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.hero-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:2;
  pointer-events:none;
}

.hero-content h1{
  font-size:clamp(48px,7vw,88px);
  font-weight:800;
  letter-spacing:-0.03em;
}

.hero-content p{
  margin-top:12px;
  color:var(--sub);
}

/* CONTENT */

.container{
  max-width:900px;
  margin:auto;
  padding:40px 20px 80px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:28px;
}

#message{
  text-align:center;
  font-weight:700;
}

#progress-bar{
  margin-top:8px;
  text-align:center;
  color:var(--sub);
}

.track{
  margin-top:18px;
  height:4px;
  background:var(--line);
  border-radius:999px;
  overflow:hidden;
}

.track-fill{
  height:100%;
  width:0;
  background:var(--text);
  transition:.5s;
}

.grid{
  margin-top:28px;
  display:flex;
  justify-content:center;
  gap:18px;
}

.stamp{
  width:110px;
  height:110px;
  border-radius:999px;
  border:1px solid var(--line);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:white;
  transition:.3s;
}

.stamp.active{
  background:var(--text);
  color:white;
  transform:translateY(-4px);
}

.actions{
  margin-top:24px;
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}

.btn{
  border:none;
  cursor:pointer;
  padding:14px 20px;
  border-radius:10px;
  font-weight:700;
}

.btn-primary{
  background:var(--text);
  color:white;
}

.btn-secondary{
  background:white;
  border:1px solid var(--line);
}

#reward-area{
  display:none;
  margin-top:24px;
  text-align:center;
}

/* MOBILE FIX */

@media (max-width:600px){

  .hero{
    height:220px;
  }

  .hero-content h1{
    font-size:32px;
  }

  .hero-content p{
    font-size:13px;
  }

  .container{
    padding:16px;
    margin-top:-10px;
  }

  .card{
    padding:16px;
  }

  .grid{
    gap:10px;
  }

  .stamp{
    width:80px;
    height:80px;
    font-size:12px;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
    padding:12px;
    font-size:14px;
  }
}
</style>
</head>
<body>

<section class="hero">
  <canvas id="bg3d"></canvas>

  <div class="hero-content">
    <h1>Stamp Rally</h1>
    <p>集めて、めぐる。</p>
  </div>
</section>

<div class="container">

  <div class="card">

    <div id="message">
      QRをスキャンしてスタンプを集めよう
    </div>

    <div id="progress-bar"></div>

    <div class="track">
      <div class="track-fill" id="track-fill"></div>
    </div>

    <div class="grid">
      <div class="stamp" id="spot1">🏛<br>SPOT1</div>
      <div class="stamp" id="spot2">🔬<br>SPOT2</div>
      <div class="stamp" id="spot3">🎨<br>SPOT3</div>
    </div>

    <div id="reward-area">
      <h3>応募条件達成</h3>
      <br>
      #応募フォームへ進む</a>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" onclick="resetStamps()">
        リセット
      </button>
    </div>

  </div>

</div>

<script>
/* ===== THREE ===== */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / document.querySelector('.hero').offsetHeight,
  0.1,
  100
);

camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('bg3d'),
  alpha:true,
  antialias:true
});

function resize(){
  const hero = document.querySelector('.hero');
  renderer.setSize(hero.clientWidth, hero.clientHeight);
  camera.aspect = hero.clientWidth / hero.clientHeight;
  camera.updateProjectionMatrix();
}

resize();
window.addEventListener('resize', resize);

scene.add(new THREE.AmbientLight(0xffffff,1));

const geo = new THREE.IcosahedronGeometry(2.2,1);

const wire = new THREE.LineSegments(
  new THREE.WireframeGeometry(geo),
  new THREE.LineBasicMaterial({
    color:0x222222,
    transparent:true,
    opacity:0.4
  })
);

scene.add(wire);

const particlesGeo = new THREE.BufferGeometry();
const particlesCount = 500;
const positions = new Float32Array(particlesCount * 3);

for(let i=0;i<particlesCount*3;i++){
  positions[i] = (Math.random()-0.5)*20;
}

particlesGeo.setAttribute(
  'position',
  new THREE.BufferAttribute(positions,3)
);

const particles = new THREE.Points(
  particlesGeo,
  new THREE.PointsMaterial({
    color:0x222222,
    size:0.03,
    transparent:true,
    opacity:0.35
  })
);

scene.add(particles);

function animate(){
  requestAnimationFrame(animate);

  wire.rotation.x += 0.002;
  wire.rotation.y += 0.004;

  particles.rotation.y += 0.0005;

  renderer.render(scene,camera);
}

animate();

/* ===== STAMP RALLY ===== */

const GOOGLE_FORM_BASE_URL =
'https://docs.google.com/forms/d/e/1FAIpQLSfANqr-pSf8YsipbWxG2BcfpK0Ewu2GmLzGp9SPbitEzAIeEA/viewform?usp=pp_url';

const FORM_ENTRY_IDS = {
 stamps:'entry.1967784020',
 count:'entry.775462935'
};

const STORAGE_KEY='stamp_rally_progress_v2';
const ALL_SPOTS=['spot1','spot2','spot3'];
const REQUIRED_STAMPS=1;

let progress={};

try{
 const saved=localStorage.getItem(STORAGE_KEY);
 if(saved) progress=JSON.parse(saved);
}catch(e){}

const urlParams=new URLSearchParams(location.search);
const currentSpot=urlParams.get('spot');

if(currentSpot && ALL_SPOTS.includes(currentSpot)){
 progress[currentSpot]=true;
 localStorage.setItem(
  STORAGE_KEY,
  JSON.stringify(progress)
 );
}

let collected=0;
const collectedSpots=[];

ALL_SPOTS.forEach(id=>{
 if(progress[id]){
  collected++;
  collectedSpots.push(id);
  document.getElementById(id).classList.add('active');
 }
});

document.getElementById('progress-bar').innerText=
`スタンプ ${collected} / ${ALL_SPOTS.length}`;

document.getElementById('track-fill').style.width=
(collected/ALL_SPOTS.length*100)+'%';

if(collected>=REQUIRED_STAMPS){

 const url=
 GOOGLE_FORM_BASE_URL+
 `&${FORM_ENTRY_IDS.stamps}=${encodeURIComponent(collectedSpots.join(','))}`+
 `&${FORM_ENTRY_IDS.count}=${collected}`;

 document.getElementById('reward-area').style.display='block';
 document.getElementById('form-link').href=url;

 document.getElementById('message').innerText=
 '応募条件を達成しました';
}

function resetStamps(){
 if(confirm('リセットしますか？')){
  localStorage.removeItem(STORAGE_KEY);
  location.href=location.pathname;
 }
}
</script>

</body>
</html>
