<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>OC Stamp Rally</title>

https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.jsscript>

<style>
:root{
  --bg:#f5f3ef;
  --card:#ffffff;
  --text:#1c1c1a;
  --sub:#76766f;
  --line:#e6e1d8;
  --accent:#a89264;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* HERO */

.hero{
  position:relative;
  height:90vh;
  min-height:520px;
  overflow:hidden;
  background:var(--bg);
}

#bg3d{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

.hero-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:2;
  pointer-events:none;
  padding:24px;
}

.hero-content h1{
  font-size:clamp(48px,7vw,88px);
  font-weight:800;
  letter-spacing:-0.03em;
}

.hero-content p{
  margin-top:12px;
  color:var(--sub);
  font-size:16px;
}

/* CONTENT */

.container{
  max-width:900px;
  margin:auto;
  padding:40px 20px 80px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:28px;
}

#message{
  text-align:center;
  font-weight:700;
}

#progress-bar{
  margin-top:8px;
  text-align:center;
  color:var(--sub);
  font-size:14px;
}

.track{
  margin-top:18px;
  height:4px;
  background:var(--line);
  border-radius:999px;
  overflow:hidden;
}

.track-fill{
  height:100%;
  width:0;
  background:var(--text);
  transition:.5s;
}

.grid{
  margin-top:28px;
  display:flex;
  justify-content:center;
  gap:18px;
}

.stamp{
  width:110px;
  height:110px;
  border-radius:999px;
  border:1px solid var(--line);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:white;
  transition:.3s;
  font-size:13px;
  line-height:1.5;
}

.stamp.active{
  background:var(--text);
  color:white;
  transform:translateY(-4px);
}

.actions{
  margin-top:24px;
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}

.btn{
  border:none;
  cursor:pointer;
  padding:14px 20px;
  border-radius:10px;
  font-weight:700;
  text-decoration:none;
  text-align:center;
  display:inline-flex;
  justify-content:center;
  align-items:center;
}

.btn-primary{
  background:var(--text);
  color:white;
}

.btn-secondary{
  background:white;
  border:1px solid var(--line);
  color:var(--text);
}

#reward-area{
  display:none;
  margin-top:24px;
  text-align:center;
  border-top:1px solid var(--line);
  padding-top:24px;
}

#reward-area h3{
  font-size:18px;
}

#reward-area p{
  margin-top:8px;
  color:var(--sub);
  font-size:14px;
}

.form-link{
  margin-top:16px;
}

/* MOBILE FIX */

@media (max-width:600px){

  body{
    min-height:100dvh;
  }

  .hero{
    height:220px;
    min-height:220px;
  }

  .hero-content h1{
    font-size:32px;
  }

  .hero-content p{
    font-size:13px;
  }

  .container{
    padding:14px;
    margin-top:0;
  }

  .card{
    padding:16px;
    border-radius:14px;
  }

  #message{
    font-size:14px;
  }

  #progress-bar{
    font-size:12px;
  }

  .track{
    margin-top:12px;
  }

  .grid{
    gap:10px;
    margin-top:20px;
  }

  .stamp{
    width:80px;
    height:80px;
    font-size:11px;
  }

  .actions{
    margin-top:18px;
    flex-direction:column;
  }

  .btn{
    width:100%;
    padding:12px;
    font-size:14px;
  }

  #reward-area{
    margin-top:18px;
    padding-top:18px;
  }
}
</style>
</head>

<body>

<section class="hero">
  <canvas id="bg3d"></canvas>

  <div class="hero-content">
    <h1>Stamp Rally</h1>
    <p>集めて、めぐる。</p>
  </div>
</section>

<div class="container">
  <div class="card">

    <div id="message">
      QRをスキャンしてスタンプを集めよう
    </div>

    <div id="progress-bar"></div>

    <div class="track">
      <div class="track-fill" id="track-fill"></div>
    </div>

    <div class="grid">
      <div class="stamp" id="spot1">
        <span>🏛</span>
        <span>SPOT1</span>
      </div>
      <div class="stamp" id="spot2">
        <span>🔬</span>
        <span>SPOT2</span>
      </div>
      <div class="stamp" id="spot3">
        <span>🎨</span>
        <span>SPOT3</span>
      </div>
    </div>

    <div id="reward-area">
      <h3>応募条件達成</h3>
      <p>下のボタンから応募フォームへお進みください。</p>
      #
        応募フォームへ進む
      </a>
    </div>

    <div class="actions">
      <button class="btn btn-secondary" onclick="resetStamps()">
        リセット
      </button>
    </div>

  </div>
</div>

<script>
/* ===== THREE.JS ===== */

(function(){
  if(typeof THREE === "undefined"){
    document.getElementById("message").innerText =
      "3Dライブラリの読み込みに失敗しました。通信環境をご確認ください。";
    return;
  }

  const hero = document.querySelector(".hero");
  const canvas = document.getElementById("bg3d");

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    60,
    hero.clientWidth / hero.clientHeight,
    0.1,
    100
  );

  camera.position.z = 8;

  const renderer = new THREE.WebGLRenderer({
    canvas:canvas,
    alpha:true,
    antialias:true
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  function resize(){
    const width = hero.clientWidth;
    const height = hero.clientHeight;

    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }

  resize();
  window.addEventListener("resize", resize);

  scene.add(new THREE.AmbientLight(0xffffff, 1));

  const light = new THREE.DirectionalLight(0xffffff, 0.8);
  light.position.set(3, 4, 6);
  scene.add(light);

  /* 3D要素 1：ワイヤーフレーム多面体 */
  const geo = new THREE.IcosahedronGeometry(2.2, 1);

  const wire = new THREE.LineSegments(
    new THREE.WireframeGeometry(geo),
    new THREE.LineBasicMaterial({
      color:0x222222,
      transparent:true,
      opacity:0.42
    })
  );

  scene.add(wire);

  /* 3D要素 2：パーティクル */
  const particlesGeo = new THREE.BufferGeometry();
  const particlesCount = 500;
  const positions = new Float32Array(particlesCount * 3);

  for(let i = 0; i < particlesCount * 3; i++){
    positions[i] = (Math.random() - 0.5) * 20;
  }

  particlesGeo.setAttribute(
    "position",
    new THREE.BufferAttribute(positions, 3)
  );

  const particles = new THREE.Points(
    particlesGeo,
    new THREE.PointsMaterial({
      color:0x222222,
      size:0.035,
      transparent:true,
      opacity:0.28
    })
  );

  scene.add(particles);

  function animate(){
    requestAnimationFrame(animate);

    wire.rotation.x += 0.002;
    wire.rotation.y += 0.004;

    particles.rotation.y += 0.0006;

    renderer.render(scene, camera);
  }

  animate();
})();

/* ===== STAMP RALLY ===== */

const GOOGLE_FORM_BASE_URL =
  "https://docs.google.com/forms/d/e/1FAIpQLSfANqr-pSf8YsipbWxG2BcfpK0Ewu2GmLzGp9SPbitEzAIeEA/viewform?usp=pp_url";

const FORM_ENTRY_IDS = {
  stamps:"entry.1967784020",
  count:"entry.775462935"
};

const STORAGE_KEY = "stamp_rally_progress_v2";
const ALL_SPOTS = ["spot1", "spot2", "spot3"];
const REQUIRED_STAMPS = 1;

let progress = {};

try{
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    progress = JSON.parse(saved);
  }
}catch(e){
  progress = {};
}

const urlParams = new URLSearchParams(window.location.search);
const currentSpot = urlParams.get("spot");

if(currentSpot && ALL_SPOTS.includes(currentSpot)){
  progress[currentSpot] = true;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  document.getElementById("message").innerText =
    "「" + currentSpot + "」のスタンプをゲット！";
}

let collected = 0;
const collectedSpots = [];

ALL_SPOTS.forEach(function(id){
  if(progress[id]){
    collected++;
    collectedSpots.push(id);

    const stamp = document.getElementById(id);
    if(stamp){
      stamp.classList.add("active");
    }
  }
});

document.getElementById("progress-bar").innerText =
  "スタンプ " + collected + " / " + ALL_SPOTS.length;

document.getElementById("track-fill").style.width =
  Math.min(100, collected / ALL_SPOTS.length * 100) + "%";

if(collected >= REQUIRED_STAMPS){
  const formUrl =
    GOOGLE_FORM_BASE_URL +
    "&" + FORM_ENTRY_IDS.stamps + "=" + encodeURIComponent(collectedSpots.join(",")) +
    "&" + FORM_ENTRY_IDS.count + "=" + encodeURIComponent(collected);

  document.getElementById("reward-area").style.display = "block";
  document.getElementById("form-link").href = formUrl;

  document.getElementById("message").innerText =
    "応募条件を達成しました";
}

function resetStamps(){
  if(confirm("スタンプをリセットしますか？")){
    localStorage.removeItem(STORAGE_KEY);
    window.location.href = window.location.pathname;
  }
}
</script>

</body>
</html>
